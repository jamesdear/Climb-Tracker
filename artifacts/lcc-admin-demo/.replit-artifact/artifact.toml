kind = "video"
videoAspectRatio = "16:9"
previewPath = "/admin-demo/"
title = "LCC admin walkthrough"
description = "An instructional video demonstrating event management, score review and corrections, results release, and administrator access for LCC Intersquad Comp Series."
version = "1.0.0"
id = "artifacts/lcc-admin-demo"
router = "path"

[[services]]
name = "web"
paths = [ "/admin-demo/" ]
localPort = 20285

[services.development]
run = "pnpm --filter @workspace/lcc-admin-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lcc-admin-demo", "run", "build" ]
serve = "static"
publicDir = "artifacts/lcc-admin-demo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20285"
BASE_PATH = "/admin-demo/"
